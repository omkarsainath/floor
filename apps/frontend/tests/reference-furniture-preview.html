<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Reference furniture — model review</title>
<style>
body{margin:24px;background:#eeece6;color:#263238;font:15px system-ui}nav{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:15px}button,select{padding:8px;border:1px solid #aaa;border-radius:6px;cursor:pointer}main{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:12px}article{background:white;border-radius:10px;padding:12px}canvas{display:block;width:100%;aspect-ratio:1.25}h3{font-size:14px;margin:4px 0}p{font-size:12px}a{color:#3355a0}
</style>
<h1>Reference furniture</h1><p>Procedural approximations, not manufacturer CAD. Dining sets include seating; desks and office chairs are separate. Click a moving front in the main viewer, or use the controls here.</p>
<nav><select id="kind"><option value="all">All models</option><option>dining</option><option>center</option><option>desk</option><option>office-chair</option></select><button id="prev">← Previous</button><span id="page"></span><button id="next">Next →</button><a href="/index.html">Back to 3D viewer</a></nav><main></main>
<script type="module">
import * as THREE from 'three';
import {REFERENCE_FURNITURE} from '../src/generators/referenceFurnitureCatalog.js';
import {createReferenceFurniture} from '../src/generators/referenceFurniture.js';
import {queueObjectAnimations,advanceObjectAnimations} from '../src/generators/objectAnimations.js';
// One WebGL context, copied into 2D canvases: no per-card context limit/leak.
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(480,384);renderer.setPixelRatio(1);
renderer.setClearColor(0xf4f2ed);renderer.toneMapping=THREE.ACESFilmicToneMapping;
const scene=new THREE.Scene();scene.add(new THREE.HemisphereLight(0xffffff,0x74634d,2.5));
const light=new THREE.DirectionalLight(0xffffff,3);light.position.set(-3,6,4);scene.add(light);
const camera=new THREE.PerspectiveCamera(32,1.25,.01,60);
const params=new URLSearchParams(location.search),kind=document.querySelector('#kind');kind.value=params.get('kind')||'all';
let page=Number(params.get('page'))||0,models=[];
function dispose(root){const mats=new Set();root.traverse(n=>{n.geometry?.dispose();if(n.material)mats.add(n.material);});mats.forEach(m=>m.dispose());}
function render(root,canvas,back=false){
 scene.add(root);const b=new THREE.Box3().setFromObject(root),s=b.getSize(new THREE.Vector3()),c=b.getCenter(new THREE.Vector3());
 const r=Math.max(s.x,s.y,s.z);camera.position.set(c.x+r*1.3,c.y+r*.95,c.z+r*(back?-1.75:1.75));camera.lookAt(c);
 renderer.render(scene,camera);canvas.getContext('2d').drawImage(renderer.domElement,0,0);scene.remove(root);
}
function build(){
 models.forEach(dispose);models=[];document.querySelector('main').replaceChildren();
 const items=REFERENCE_FURNITURE.filter(s=>kind.value==='all'||s.kind===kind.value),pages=Math.ceil(items.length/12);page=Math.max(0,Math.min(page,pages-1));
 document.querySelector('#page').textContent=`Page ${page+1}/${pages} · ${items.length} models`;
 for(const s of items.slice(page*12,page*12+12)){
  const card=document.createElement('article'),title=document.createElement('h3'),canvas=document.createElement('canvas'),note=document.createElement('p');
  title.textContent=s.label;note.textContent=`${s.w} × ${s.d} m · estimated. ${s.page?'PDF page '+s.page:''}`;
  canvas.width=480;canvas.height=384;card.append(title,canvas,note);document.querySelector('main').append(card);
  const root=createReferenceFurniture(s.id,s.w,s.d);models.push(root);let back=s.kind==='desk';
  const draw=()=>render(root,canvas,back);const parts=new Set();root.traverse(n=>{if(n.userData.furniturePart)parts.add(n.userData.furniturePart);});
  for(const part of parts){const button=document.createElement('button');button.textContent=part;button.onclick=()=>{const q=[];queueObjectAnimations(root,q,part);advanceObjectAnimations(q,1);draw();};card.append(button);}
  const rotate=document.createElement('button');rotate.textContent='Other side';rotate.onclick=()=>{back=!back;draw();};card.append(rotate);
  if(params.has('open')){const q=[];queueObjectAnimations(root,q);advanceObjectAnimations(q,1);}draw();
 }
 document.body.dataset.ready='true';
}
kind.onchange=()=>{page=0;build();};document.querySelector('#prev').onclick=()=>{page--;build();};document.querySelector('#next').onclick=()=>{page++;build();};build();
</script></html>
