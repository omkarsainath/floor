<!doctype html><html><head><meta charset="utf-8"><title>Ceiling lighting preview</title><style>body{margin:0;background:#16191d;color:white;font:16px sans-serif}p{position:absolute;left:20px;top:0}</style></head><body><p>Reference ceiling · actual light spill and soft glow</p><script type="module">
import * as THREE from 'three';
import {buildCeilingLight} from '../src/design/ceilingLights.js';
import {buildCeilingProfile} from '../src/design/ceilingProfiles.js';
import {REFERENCE_CEILING_TYPES} from '../src/design/referenceCeilings.js';
import {renderModelWithCeilingGlow} from '../src/ui/renderMode.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#272a30');
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1;document.body.append(renderer.domElement);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.05,50);camera.position.set(3,1.4,5.3);camera.lookAt(3,2.6,1.2);
scene.add(new THREE.HemisphereLight(0xe4efff,0x847361,.25));
const room={id:'preview',height:3,points:[{x:0,y:0},{x:6,y:0},{x:6,y:4},{x:0,y:4}]};
const fixture=new URLSearchParams(location.search).get('fixture');
const ceiling=buildCeilingProfile({room,style:REFERENCE_CEILING_TYPES[0],selection:{ceilingDropM:.23}});if(!fixture)scene.add(ceiling);
else {
 scene.add(buildCeilingLight({placement:{id:'demo',type:fixture,x:3,z:2,lumens:600},ceilingY:2.8,roomId:'preview'}));
 const slab=new THREE.Mesh(new THREE.BoxGeometry(6,.1,4),new THREE.MeshStandardMaterial({color:'#e5ded0'}));slab.position.set(3,2.85,2);scene.add(slab);
 const block=new THREE.Mesh(new THREE.BoxGeometry(.7,.9,.7),new THREE.MeshStandardMaterial({color:'#80664c'}));block.position.set(3,.45,2);block.castShadow=block.receiveShadow=true;scene.add(block);
 camera.lookAt(3,1.2,1);document.querySelector('p').textContent=fixture+' · 600 lm · object shadow comparison';
}
for(const [w,h,d,x,y,z] of [[6,.1,4,3,-.05,2],[6,3,.1,3,1.5,-.05],[.1,3,4,-.05,1.5,2],[.1,3,4,6.05,1.5,2]]){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color:'#c6bca9',roughness:.85}));m.position.set(x,y,z);m.receiveShadow=m.castShadow=true;scene.add(m);}
function frame(){renderModelWithCeilingGlow(scene,renderer,camera);document.body.dataset.ready='true';requestAnimationFrame(frame);}frame();
</script></body></html>
