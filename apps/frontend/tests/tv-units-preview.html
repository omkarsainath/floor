<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>TV unit variants — visual check</title>
<style>
  body{margin:20px;background:#eeebe5;color:#26343c;font:15px system-ui}
  main{display:grid;grid-template-columns:repeat(auto-fit,minmax(520px,1fr));gap:12px}
  article{background:#fff;border-radius:12px;overflow:hidden;padding:10px}
  canvas{width:100%;aspect-ratio:4/3;display:block}button{padding:8px;margin:3px;border:1px solid #aaa;border-radius:5px;cursor:pointer}
</style>
<h1>TV units</h1>
<p>Reference-inspired TV units. Drag to orbit, scroll to zoom, and use the buttons to open drawers and display doors.</p>
<main></main>
<script type="module">
import * as THREE from 'three';
import {createTvUnit,TV_UNIT_CATALOG} from '../src/generators/tvUnits.js';
import {OrbitControls} from 'three/examples/jsm/controls/OrbitControls.js';
import {queueObjectAnimations,advanceObjectAnimations} from '../src/generators/objectAnimations.js';
const previews=[];
const params=new URLSearchParams(location.search), page=Math.max(0,Math.min(3,Number(params.get('page'))||0));
const nav=document.createElement('p');
for(let i=0;i<4;i++){const link=document.createElement('a');link.href='?page='+i+(params.has('open')?'&open':'');link.textContent='Designs '+(i*4+1)+'–'+(i*4+4);link.style.marginRight='24px';nav.append(link);}
document.querySelector('main').before(nav);
for(const item of TV_UNIT_CATALOG.slice(page*4,page*4+4)){
 const type=item.id;
 const card=document.createElement('article'), title=document.createElement('h3');title.textContent=item.label;
 const canvas=document.createElement('canvas');card.append(title,canvas);document.querySelector('main').append(card);
 const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setSize(640,480,false);
 renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
 renderer.setPixelRatio(1);renderer.setClearColor(0xf5f2ed);renderer.toneMapping=THREE.ACESFilmicToneMapping;
 const scene=new THREE.Scene();scene.add(new THREE.HemisphereLight(0xffffff,0x716453,1.2));
 const light=new THREE.DirectionalLight(0xffffff,2.3);light.position.set(-3,5,5);light.castShadow=true;light.shadow.mapSize.set(1024,1024);light.shadow.camera.left=-2;light.shadow.camera.right=2;light.shadow.camera.top=3;light.shadow.camera.bottom=-1;light.shadow.normalBias=.015;scene.add(light);
 const camera=new THREE.PerspectiveCamera(36,640/480,.01,30);camera.position.set(2.1,2.1,6.7);camera.lookAt(0,1.15,0);
 const controls=new OrbitControls(camera,canvas);controls.target.set(0,1.15,0);controls.update();
 const root=createTvUnit(type,item.w,item.d);scene.add(root);const queue=[];
 const floor=new THREE.Mesh(new THREE.PlaneGeometry(20,20),new THREE.MeshStandardMaterial({color:0xddd6cb}));
 floor.receiveShadow=true;floor.rotation.x=-Math.PI/2;floor.position.y=-.003;scene.add(floor);
 for(const part of ['doors','drawers']){
  let has=false;root.traverse(n=>{if(n.userData.furniturePart===part)has=true;});if(!has)continue;
  const button=document.createElement('button');button.textContent=part;button.onclick=()=>queueObjectAnimations(root,queue,part);card.append(button);
 }
 if(new URLSearchParams(location.search).has('open')){queueObjectAnimations(root,queue);advanceObjectAnimations(queue,1);}
 previews.push({renderer,scene,camera,queue});
}
function frame(){for(const p of previews){advanceObjectAnimations(p.queue);p.renderer.render(p.scene,p.camera);}requestAnimationFrame(frame);}
frame();
document.body.dataset.ready='true';document.body.dataset.page=page;
</script>
</html>
